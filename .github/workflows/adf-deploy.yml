              -ResourceGroupName ${{ vars.RESOURCE_GROUP }} `
              -DataFactoryName ${{ vars.DATA_FACTORY }} `
              -PreDeployment $true `
              -DeleteDeployment $false

      - name: Deploy ARM template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: ./ARMTemplateForFactory.json
          parameters: >
            ./ARMTemplateParametersForFactory.json
            factoryName=${{ vars.DATA_FACTORY }}
          deploymentMode: Incremental

      - name: Post-deployment
        uses: azure/powershell@v3
        with:
          azPSVersion: latest
          pwsh: true
          inlineScript: |
            ./PrePostDeploymentScript.Ver2.ps1 `
              -ArmTemplate "./ARMTemplateForFactory.json" `
              -ArmTemplateParameters "./ARMTemplateParametersForFactory.json" `
              -ResourceGroupName ${{ vars.RESOURCE_GROUP }} `
              -DataFactoryName ${{ vars.DATA_FACTORY }} `
              -PreDeployment $false `
              -DeleteDeployment $true

  # =========================
  # PRODUCTION
  # =========================
  deploy-production:
    name: Deploy ADF to Production
    runs-on: ubuntu-latest
    needs: deploy-testing
    environment: production

    steps:

      # we 1st download the previously uploaded artifact so we can leverage it later in the release job     
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
